<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Circular dark background -->
  <circle cx="50" cy="50" r="48" fill="#0B0F19" stroke="#F59E0B" stroke-width="2.5" stroke-opacity="0.8"/>
  
  <!-- Robot Antenna -->
  <circle cx="50" cy="22" r="3.5" fill="#F59E0B" />
  <line x1="50" y1="25.5" x2="50" y2="33" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Robot Ears -->
  <rect x="22" y="45" width="4" height="12" rx="2" fill="#F59E0B" opacity="0.9" />
  <rect x="74" y="45" width="4" height="12" rx="2" fill="#F59E0B" opacity="0.9" />
  
  <!-- Robot Head -->
  <rect x="26" y="33" width="48" height="38" rx="10" fill="#161F32" stroke="#FFFFFF" stroke-width="2.5" />
  
  <!-- Smiling Eyes -->
  <path d="M 37 47 Q 41 43 45 47" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 55 47 Q 59 43 63 47" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none" />
  
  <!-- Friendly Smile -->
  <path d="M 40 57 Q 50 65 60 57" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />
</svg>